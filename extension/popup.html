<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeScroll AI</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <div class="container">

        <!-- HEADER -->
        <div class="header">

            <div class="logo">
                <img src="safescroll-logo.png" alt="SafeScroll AI">
            </div>

            <div class="brand">
                <h1>SafeScroll <span>AI</span></h1>
                <p>Tamil Hate Speech Detection</p>
            </div>

        </div>


        <!-- STATUS -->
        <div class="status-row">

            <div class="status">
                <span class="dot"></span>
                <span id="backendStatus">Backend Online</span>
            </div>

            <div class="version">
                v1.0
            </div>

        </div>


        <!-- PROTECTION CONTROL -->
        <div class="protection-card">

            <div>
                <h3>Protection</h3>
                <p>Analyze YouTube comments automatically</p>
            </div>

            <label class="switch">
                <input type="checkbox" id="protectionToggle" checked>
                <span class="slider"></span>
            </label>

        </div>


        <!-- STATS -->
        <div class="stats">

            <div class="stat-card">
                <span class="stat-icon">🔍</span>
                <strong id="scannedCount">0</strong>
                <small>Analyzed</small>
            </div>

            <div class="stat-card">
                <span class="stat-icon">🟢</span>
                <strong id="safeCount">0</strong>
                <small>Safe</small>
            </div>

            <div class="stat-card">
                <span class="stat-icon">⚠️</span>
                <strong id="offensiveCount">0</strong>
                <small>Flagged</small>
            </div>

        </div>


        <!-- RESET -->
        <button id="resetStatsBtn" class="reset-btn">
            ↻ Reset Statistics
        </button>


        <!-- ANALYZER -->
        <div class="section-title">

            <span>Analyze a comment</span>

            <span class="ai-badge">
                AI
            </span>

        </div>


        <textarea
            id="comment"
            placeholder="Enter a Tamil, English, or Tamil-English comment..."
            maxlength="500"
        ></textarea>


        <div class="counter">
            <span id="charCount">0</span>/500
        </div>


        <button id="analyzeBtn">
            ✨ Analyze Comment
        </button>


        <!-- RESULT -->
        <div id="result" class="result hidden">

            <div id="resultIcon" class="result-icon">
                🛡️
            </div>

            <h2 id="prediction">
                ---
            </h2>

            <p id="confidence">
                Confidence: --%
            </p>

            <div class="confidence-bar">

                <div id="confidenceFill"></div>

            </div>

        </div>


        <!-- ERROR -->
        <div id="error" class="error hidden"></div>


        <!-- FOOTER -->
        <footer>

            <img
                src="safescroll-logo.png"
                alt="SafeScroll AI"
                class="footer-logo"
            >

            <span>SafeScroll AI</span>

            <span>•</span>

            <span>Machine Learning</span>

        </footer>

    </div>


    <script src="popup.js"></script>

</body>

</html>
